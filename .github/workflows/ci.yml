name: Settlement regression CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} / TZ=${{ matrix.timezone }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        timezone: [UTC, Asia/Seoul, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
      IMPL: fixed
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run settlement regression suite
        run: npm test

  gate:
    name: Regression gate catches the faulty builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm faulty builds fail and the corrected build passes
        run: node scripts/capture-evidence.js
